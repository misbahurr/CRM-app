[project]
name = "micro-crm-backend"
version = "0.1.0"
description = "FastAPI backend for the AI-powered micro-CRM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.55.0",
    "python-dotenv>=1.0.1",
    "cryptography>=44.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["seed/data/*.csv"]
